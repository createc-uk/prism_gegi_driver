# Prism endpoint overrides for the C++ multi-endpoint GeGi driver.
# Endpoint IDs and defaults mirror PhdsGegiDriver's compiled configuration.
# Energy-scale correction applied to every parsed site energy (keV) before
# any downstream consumer (spectrum, activity, heatmap, isotope-ID, recorded
# bags) sees it: corrected = c0 + c1*E + c2*E^2. Defaults 0.0/1.0/0.0 = no
# correction. The fitted rig coefficients below are the default. Disable with
# --energy-cal-c0 0 --energy-cal-c1 1 --energy-cal-c2 0.
# Explicit CLI flags take precedence over YAML.
# Fitted ROS devel calibration for the GeGi rig (2026-08-26).
# Refit if detector hardware is recalibrated; override explicitly by CLI.
energy_cal_c0: -0.0861
energy_cal_c1: 0.9994308
energy_cal_c2: 0.0

endpoints:
  compton_event:
    name: gegi.driver.compton_event
  energy_deposit:
    name: gegi.driver.energy_deposit
  energy_deposit_singles:
    name: gegi.driver.energy_deposit_singles
  run_info:
    name: gegi.detector.run_info
  detector_info:
    name: gegi.detector.detector_info
  dead_time_percent:
    name: gegi.detector.dead_time_percent
  command:
    name: gegi.detector.command
  command_result:
    name: gegi.detector.command_result
